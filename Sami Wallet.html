<meta name="theme-color" content="#14213D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{--bg:#F2F4F8;--card:#FFFFFF;--ink:#14213D;--mut:#667085;--line:#E1E6EE;--acc:#14213D;--gold:#F2B705;--goldink:#14213D;--bad:#B3261E;--good:#1B7F5C;--track:#E6EAF1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1322;--card:#151E33;--ink:#EDF1F8;--mut:#97A3B8;--line:#26334F;--acc:#EDF1F8;--bad:#F2877F;--good:#5FD1A3;--track:#223050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1322;--card:#151E33;--ink:#EDF1F8;--mut:#97A3B8;--line:#26334F;--acc:#EDF1F8;--bad:#F2877F;--good:#5FD1A3;--track:#223050;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;padding-bottom:96px}
main{max-width:560px;margin:0 auto;padding:14px 16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mon b{font-size:16px;font-weight:600}
.mon button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px 20px 18px}
.hero small{display:block;opacity:.75;font-size:13px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .big.neg{color:#FF9B93}
.hero .day{font-size:13px;opacity:.85}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.hero .bar{background:rgba(255,255,255,.2);margin-top:14px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.hero .bar i{background:var(--gold)}
.bar i.over{background:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat small{color:var(--mut);font-size:12px}
.stat b{display:block;font-size:18px;font-weight:600;margin-top:2px}
h2{font-size:15px;font-weight:600;margin:20px 2px 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px}
.row .top span{color:var(--mut);font-size:13px;white-space:nowrap}
.tx{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;font-size:14px}
.tx .m small{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tx .a{font-weight:600;font-size:14px;white-space:nowrap}
.tx .a.inc{color:var(--good)}
.tx .x{width:36px;height:36px;border-radius:10px;color:var(--mut);font-size:15px}
.tx .x.sure{background:var(--bad);color:#fff;width:auto;padding:0 10px;font-size:12px}
.day-h{color:var(--mut);font-size:12.5px;margin:14px 2px 6px}
.empty{text-align:center;color:var(--mut);padding:36px 12px;border:1px dashed var(--line);border-radius:16px;margin-top:10px}
.bud{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bud span{flex:1;font-size:14px}
.bud input,.fld input{width:110px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bud .x{width:34px;height:34px;color:var(--mut)}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;text-align:left;width:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.btn{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600}
.note{color:var(--mut);font-size:12px;margin:18px 2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;padding:8px 0;font-size:13px;color:var(--mut);font-weight:600}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";display:block;width:18px;height:3px;border-radius:3px;background:var(--gold);margin:4px auto 0}
nav .plus{flex:none;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--goldink);font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 6px 16px rgba(20,33,61,.3);padding:0}
.ov{position:fixed;inset:0;background:rgba(8,12,24,.55);display:none;align-items:flex-end;z-index:10}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{padding:9px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink)}
.amt{width:100%;font-size:34px;font-weight:700;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fld{display:flex;gap:8px;margin-bottom:12px}
.fld input{flex:1;width:auto;text-align:left}
.go{width:100%;background:var(--gold);color:var(--goldink);border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.err{color:var(--bad);font-size:13px;margin:-4px 0 8px;min-height:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="home" class="on">Overview</button>
  <button data-tab="hist">History</button>
  <button class="plus" data-act="open" aria-label="Add transaction">+</button>
  <button data-tab="bud">Budgets</button>
</nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
var KEY="pocketbudget.v1";
var S={cur:"E",budget:{"Food":0,"Transport":0,"Airtime & data":0,"Bills":0,"Business":0,"Family":0,"Other":0},tx:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.budget&&p.tx)S=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var today=ymd(new Date()),mon=today.slice(0,7),tab="home",delId=null;
var form={type:"exp",cat:"",err:""};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function money(n){return S.cur+" "+(Math.round(n*100)/100).toLocaleString("en-ZA",{maximumFractionDigits:2});}
function monthLabel(m){return new Date(m+"-01T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
function shift(d){var y=+mon.slice(0,4),m=+mon.slice(5)-1+d;var dt=new Date(y,m,1);mon=ymd(dt).slice(0,7);}
function cats(){var c=Object.keys(S.budget);S.tx.forEach(function(t){if(t.type==="exp"&&c.indexOf(t.cat)<0)c.push(t.cat);});return c;}
function monthTx(){return S.tx.filter(function(t){return t.date.slice(0,7)===mon;});}
function sum(a){return a.reduce(function(s,t){return s+t.amt;},0);}

function home(){
  var tx=monthTx(),ex=tx.filter(function(t){return t.type==="exp";}),inc=sum(tx.filter(function(t){return t.type==="inc";})),spent=sum(ex);
  var bt=0;Object.keys(S.budget).forEach(function(k){bt+=+S.budget[k]||0;});
  var left=bt-spent,pct=bt>0?Math.min(100,spent/bt*100):0;
  var h='<div class="mon"><button data-act="prev" aria-label="Previous month">‹</button><b>'+monthLabel(mon)+'</b><button data-act="next" aria-label="Next month">›</button></div>';
  var sub="Set category budgets to see what you can spend.";
  if(bt>0){
    sub=left>=0?"left of "+money(bt)+" budget":"over your "+money(bt)+" budget";
  }
  var dayline="";
  if(bt>0&&mon===today.slice(0,7)&&left>0){
    var dt=new Date(),dim=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(),rem=dim-dt.getDate()+1;
    dayline='<div class="day">About '+money(left/rem)+" a day for the next "+rem+" days</div>";
  }
  h+='<div class="hero"><small>Left to spend</small><div class="big'+(left<0?" neg":"")+'">'+(bt>0?money(left):"–")+'</div><div class="day">'+sub+'</div>'+dayline+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="stats"><div class="stat"><small>Spent</small><b>'+money(spent)+'</b></div><div class="stat"><small>Income</small><b>'+money(inc)+'</b></div></div>';
  if(!tx.length){h+='<div class="empty">Nothing recorded for this month.<br>Tap + to add an expense or income.</div>';return h;}
  h+="<h2>By category</h2>";
  cats().forEach(function(c){
    var s=sum(ex.filter(function(t){return t.cat===c;})),b=+S.budget[c]||0;
    if(!s&&!b)return;
    var over=b>0&&s>b,w=b>0?Math.min(100,s/b*100):(s>0?100:0);
    h+='<div class="row"><div class="top"><b>'+esc(c)+'</b><span>'+money(s)+(b>0?" of "+money(b):"")+'</span></div><div class="bar"><i class="'+(over?"over":"")+'" style="width:'+w+'%;'+(b>0?"":"background:var(--mut)")+'"></i></div></div>';
  });
  return h;
}
function hist(){
  var tx=monthTx().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id;});
  var h='<div class="mon"><button data-act="prev" aria-label="Previous month">‹</button><b>'+monthLabel(mon)+'</b><button data-act="next" aria-label="Next month">›</button></div>';
  if(!tx.length)return h+'<div class="empty">No transactions this month.</div>';
  var last="";
  tx.forEach(function(t){
    if(t.date!==last){last=t.date;h+='<div class="day-h">'+new Date(t.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+"</div>";}
    h+='<div class="tx"><div class="m"><b>'+esc(t.type==="inc"?"Income":t.cat)+'</b>'+(t.note?"<small>"+esc(t.note)+"</small>":"")+'</div><div class="a '+t.type+'">'+(t.type==="inc"?"+":"−")+money(t.amt)+'</div>'+
      (delId===t.id?'<button class="x sure" data-act="del" data-id="'+t.id+'">Delete?</button>':'<button class="x" data-act="ask" data-id="'+t.id+'" aria-label="Delete">✕</button>')+"</div>";
  });
  return h;
}
function bud(){
  var h="<h2>Monthly budget per category</h2>";
  Object.keys(S.budget).forEach(function(c,i){
    h+='<div class="bud"><span>'+esc(c)+'</span><input type="number" inputmode="decimal" min="0" value="'+(S.budget[c]||"")+'" placeholder="0" data-bud="'+i+'" aria-label="Budget for '+esc(c)+'"><button class="x" data-act="rmcat" data-i="'+i+'" aria-label="Remove '+esc(c)+'">✕</button></div>';
  });
  h+='<div class="add"><input id="newcat" placeholder="New category" maxlength="24"><button class="btn" data-act="addcat">Add</button></div>';
  h+='<h2>Currency symbol</h2><div class="add"><input id="cur" value="'+esc(S.cur)+'" maxlength="4"></div>';
  h+='<p class="note">Budgets repeat every month. Your data is saved in this browser on this device only, so it won’t appear on another phone or after clearing site data.</p>';
  return h;
}
function render(){
  document.getElementById("app").innerHTML=tab==="home"?home():tab==="hist"?hist():bud();
  document.querySelectorAll("nav [data-tab]").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab);});
}
function sheet(){
  var cs=cats();if(!form.cat||cs.indexOf(form.cat)<0)form.cat=cs[0]||"Other";
  var h='<div class="seg"><button data-act="type" data-v="exp" class="'+(form.type==="exp"?"on":"")+'">Expense</button><button data-act="type" data-v="inc" class="'+(form.type==="inc"?"on":"")+'">Income</button></div>';
  h+='<input class="amt" id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="'+S.cur+' 0" aria-label="Amount">';
  if(form.type==="exp"){h+='<div class="chips">'+cs.map(function(c){return '<button data-act="cat" data-v="'+esc(c)+'" class="'+(c===form.cat?"on":"")+'">'+esc(c)+"</button>";}).join("")+"</div>";}
  else h+='<div style="height:12px"></div>';
  h+='<div class="fld"><input id="note" placeholder="Note (optional)" maxlength="60"><input id="date" type="date" value="'+today+'" style="max-width:150px"></div>';
  h+='<div class="err" id="err"></div><button class="go" data-act="save">Save '+(form.type==="exp"?"expense":"income")+"</button>";
  document.getElementById("sheet").innerHTML=h;
}
function openSheet(){form.type="exp";sheet();document.getElementById("ov").classList.add("on");setTimeout(function(){var a=document.getElementById("amt");if(a)a.focus();},60);}
function closeSheet(){document.getElementById("ov").classList.remove("on");}

document.addEventListener("click",function(e){
  var t=e.target.closest("button,.ov");if(!t)return;
  if(t.id==="ov"&&e.target===t){closeSheet();return;}
  if(t.dataset.tab){tab=t.dataset.tab;delId=null;render();window.scrollTo(0,0);return;}
  var a=t.dataset.act;if(!a)return;
  if(a==="open")openSheet();
  else if(a==="prev"){shift(-1);render();}
  else if(a==="next"){shift(1);render();}
  else if(a==="type"){var n=document.getElementById("note").value,d=document.getElementById("date").value,am=document.getElementById("amt").value;form.type=t.dataset.v;sheet();document.getElementById("note").value=n;document.getElementById("date").value=d;document.getElementById("amt").value=am;}
  else if(a==="cat"){form.cat=t.dataset.v;document.querySelectorAll(".chips button").forEach(function(b){b.classList.toggle("on",b.dataset.v===form.cat);});}
  else if(a==="save"){
    var amt=parseFloat(document.getElementById("amt").value),date=document.getElementById("date").value||today;
    if(!(amt>0)){document.getElementById("err").textContent="Enter an amount greater than 0.";return;}
    S.tx.push({id:Date.now(),type:form.type,amt:amt,cat:form.type==="exp"?form.cat:"Income",note:document.getElementById("note").value.trim(),date:date});
    save();mon=date.slice(0,7);closeSheet();render();
  }
  else if(a==="ask"){delId=+t.dataset.id;render();}
  else if(a==="del"){S.tx=S.tx.filter(function(x){return x.id!==+t.dataset.id;});delId=null;save();render();}
  else if(a==="addcat"){var i=document.getElementById("newcat"),v=i.value.trim();if(v&&!(v in S.budget)){S.budget[v]=0;save();render();}}
  else if(a==="rmcat"){var k=Object.keys(S.budget)[+t.dataset.i];delete S.budget[k];save();render();}
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.bud!==undefined){S.budget[Object.keys(S.budget)[+el.dataset.bud]]=parseFloat(el.value)||0;save();}
  else if(el.id==="cur"){S.cur=el.value.trim()||"E";save();}
});
render();
</script>
</body>
</html>
